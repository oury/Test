name: Deploy Star Chart

on:
  push:
    branches: [master]
    paths: ["kids-planner/**", ".github/workflows/deploy-star-chart.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kids-planner
      - id: deployment
        uses: actions/deploy-pages@v4
